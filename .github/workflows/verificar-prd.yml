name: Teste ponta a ponta em produção

# Só roda à mão. Cria uma conta de equipe temporária, confere o portal de produção contra o Notion e apaga a conta.
on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/verificar-prd.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
