name: Quem usou homolog e produção

# Só roda à mão e só lê. Sem e-mails nem IPs no log (repositório público).
on:
  workflow_dispatch:
    inputs:
      email_base_b64:
        description: E-mail base da Marina em base64
        required: true

jobs:
  quem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relatório
        run: |
          E=$(echo "${{ inputs.email_base_b64 }}" | base64 -d); echo "::add-mask::$E"
          EMAIL_BASE="$E" node scripts/quem-usou.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
