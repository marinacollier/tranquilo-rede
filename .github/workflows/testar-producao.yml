name: Testar em produção (ponta a ponta)

# Só roda à mão. Usa o banco de verdade com contas descartáveis (teste-e2e-...) e apaga tudo no fim.
# alvo = local: gera o site desta versão da main e testa no runner (com o banco de produção);
# alvo = site: testa o site no ar (GitHub Pages). O log é público: só sai OK/FALHA por passo, sem dados pessoais.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: local (esta versão da main) ou site (o que está no ar)
        default: local
      dominio:
        description: domínio dos e-mails descartáveis
        default: teste-e2e.invalid

concurrency:
  group: testar-producao
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador
        run: |
          npm ci --no-audit --no-fund > /dev/null
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Gerar e servir o site desta versão
        if: inputs.alvo != 'site'
        env:
          SITE_SECRET: ${{ secrets.SITE_SECRET }}
        run: |
          node scripts/build.mjs > /dev/null
          (python3 -m http.server 8080 --directory dist > /dev/null 2>&1 &)
          sleep 2
      - name: Testar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASE: ${{ inputs.alvo == 'site' && 'https://marinacollier.github.io/tranquilo-rede/' || 'http://localhost:8080/' }}
          EXECUCAO: ${{ github.run_id }}
          DOMINIO: ${{ inputs.dominio }}
        run: node scripts/testar-producao.mjs
      - name: Limpar (sempre, mesmo se o teste cair no meio)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MODO: limpar
        run: node scripts/testar-producao.mjs
