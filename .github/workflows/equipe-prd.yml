name: Copiar equipe para a produção

# Só roda à mão. Copia as contas reais de equipe e administração do ambiente de teste para o de produção (mesma senha).
on:
  workflow_dispatch:
    inputs:
      adm_sha256:
        description: SHA-256 de um e-mail que deve entrar como administração (opcional)
        required: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/equipe-prd.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADM_SHA256: ${{ inputs.adm_sha256 }}
