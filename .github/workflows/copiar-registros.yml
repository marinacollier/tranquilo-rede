name: Copiar registros do Supabase

# Os registros do Supabase (login, chamadas à API, erros do banco) somem em cerca de um dia no plano gratuito.
# Esta rotina copia tudo para a tabela registros_supabase, dentro do próprio banco (só a administração lê).
# Precisa do segredo SUPABASE_ACCESS_TOKEN; sem ele, termina sem fazer nada.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copiar-registros
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copiar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/copiar-registros.mjs
