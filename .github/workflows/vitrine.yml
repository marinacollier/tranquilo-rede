name: Vitrine de demonstração

# Só roda à mão. Cria (ou recria) uma conta fictícia em cada etapa do fluxo (casas e artistas), para demonstração.
# Modo equilibrio: apaga todos os dados de teste antigos e cria 2 casos em cada status (casas, artistas, datas, contratos
# e campanhas), com e-mails <papel>.<status>N@tranquilo.teste. Ver scripts/equilibrio.mjs.
# O hash bcrypt da senha entra como parâmetro: a senha não passa pelo repositório.
on:
  workflow_dispatch:
    inputs:
      email_base_b64:
        description: E-mail base em base64 (contas viram base+papel-etapa)
        required: false
      senha_hash:
        description: Hash bcrypt da senha das contas
        required: false
      modo:
        description: criar, apagar ou equilibrio
        type: choice
        options: [criar, apagar, equilibrio]
        default: criar

jobs:
  caso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vitrine.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENHA_HASH: ${{ inputs.senha_hash }}
          EMAIL_BASE_B64: ${{ inputs.email_base_b64 }}
          MODO: ${{ inputs.modo }}
