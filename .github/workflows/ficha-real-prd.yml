name: Copiar Ficha real para a produção

# Só roda à mão. Copia as contas reais de equipe e administração do ambiente de teste para o de produção (mesma senha).
on:
  workflow_dispatch:
    inputs:
      pares_b64:
        description: trecho do nome|email;... em base64
      ficha_b64:
        description: Ficha em JSON base64 (opcional)
        required: false
      senha_hash:
        description: hash bcrypt

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ficha-real-prd.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PARES_B64: ${{ inputs.pares_b64 }}
          FICHA_B64: ${{ inputs.ficha_b64 }}
          SENHA_HASH: ${{ inputs.senha_hash }}

