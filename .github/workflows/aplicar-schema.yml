name: Aplicar schema no banco (Supabase)

# Só roda à mão (Actions > Aplicar schema > Run workflow). Faz o mesmo que colar o supabase/schema.sql no SQL Editor.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: homolog (teste) ou prd (produção)
        default: homolog

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node supabase/aplicar.mjs
        env:
          ALVO: ${{ inputs.alvo }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
