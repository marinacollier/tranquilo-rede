name: Demonstração com casos reais (produção)

# Só roda à mão. Copia as contas reais de equipe e administração do ambiente de teste para o de produção (mesma senha).
on:
  workflow_dispatch:
    inputs:
      emails_b64:
        description: casa,artista em base64
      senha_hash:
        description: hash bcrypt

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/demo-real.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EMAILS_B64: ${{ inputs.emails_b64 }}
          SENHA_HASH: ${{ inputs.senha_hash }}

